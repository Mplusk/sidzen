name: Check backup integrity (temporary)
on:
  pull_request:
    types: [opened, synchronize]
jobs:
  inspect:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'codex/backup-readonly-check-20261110'
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    environment: production
    concurrency:
      group: production-diagnostics
      cancel-in-progress: false
    permissions:
      contents: read
    steps:
      - name: Inspect backups read-only
        env:
          DEPLOY_SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          install -d -m 0700 "${HOME}/.ssh"
          printf '%s\n' "${DEPLOY_SSH_PRIVATE_KEY}" > "${HOME}/.ssh/preflight_key"
          printf '%s\n' "${DEPLOY_KNOWN_HOSTS}" > "${HOME}/.ssh/known_hosts"
          chmod 0600 "${HOME}/.ssh/preflight_key" "${HOME}/.ssh/known_hosts"
          ssh -i "${HOME}/.ssh/preflight_key" -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=15 "${DEPLOY_USER}@${DEPLOY_HOST}" 'bash -s' <<'REMOTE'
          set -Eeuo pipefail
          root=/var/backups/3dprinta
          printf 'Server time UTC: '; date -u +%Y-%m-%dT%H:%M:%SZ
          if [[ ! -d "$root" ]]; then echo 'Backup directory unavailable'; exit 1; fi
          latest=$(find "$root" -mindepth 1 -maxdepth 1 -type d -printf '%f\n' | grep -E '^20[0-9]{6}T[0-9]{6}Z$' | sort -r | head -n 1 || true)
          [[ -n "$latest" ]] || { echo 'No backup directory'; exit 1; }
          printf 'Newest backup UTC: %s\n' "$latest"
          cd "$root/$latest"
          for f in database.dump model-files.tar.gz product-images.tar.gz privacy-ledger.tar.gz SHA256SUMS; do
            if [[ -f "$f" && -s "$f" && ! -L "$f" ]]; then printf '%s present, bytes: ' "$f"; wc -c < "$f"; else echo "Incomplete backup: $f"; exit 1; fi
          done
          [[ $(wc -l < SHA256SUMS) -eq 4 ]] || { echo 'Unexpected checksum manifest'; exit 1; }
          for f in database.dump model-files.tar.gz product-images.tar.gz privacy-ledger.tar.gz; do awk -v expected="$root/$latest/$f" 'length($1)==64 && $2==expected {n++} END {exit n!=1}' SHA256SUMS || { echo 'Unexpected checksum manifest'; exit 1; }; done
          if timeout 240s sha256sum --quiet --status -c SHA256SUMS; then echo 'All backup file checksums: valid'; else echo 'Backup file checksums: FAILED or timed out'; exit 1; fi
          if timeout 90s docker exec -i 3dprinta-db-1 pg_restore --list < database.dump > /dev/null 2>&1; then echo 'PostgreSQL dump manifest: readable'; else echo 'PostgreSQL dump manifest: unreadable or timed out'; exit 1; fi
          REMOTE
      - name: Remove runner credentials
        if: always()
        run: rm -f -- "${HOME}/.ssh/preflight_key"
