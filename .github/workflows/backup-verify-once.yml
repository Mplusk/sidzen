name: Create and verify production backup (temporary)
on:
  pull_request:
    types: [opened, synchronize, reopened]
jobs:
  backup_check:
    name: Create and verify backup
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'codex/stock-guest-access-20261109'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: production
    concurrency:
      group: production-deploy
      cancel-in-progress: false
    permissions:
      contents: read
    steps:
      - name: Create and verify a fresh backup on the server
        env:
          DEPLOY_SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          install -d -m 0700 "${HOME}/.ssh"
          printf '%s\n' "${DEPLOY_SSH_PRIVATE_KEY}" > "${HOME}/.ssh/preflight_key"
          printf '%s\n' "${DEPLOY_KNOWN_HOSTS}" > "${HOME}/.ssh/known_hosts"
          chmod 0600 "${HOME}/.ssh/preflight_key" "${HOME}/.ssh/known_hosts"
          ssh -i "${HOME}/.ssh/preflight_key" -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=15 "${DEPLOY_USER}@${DEPLOY_HOST}" 'bash -s' <<'REMOTE'
          set -Eeuo pipefail
          backup_root=/var/backups/3dprinta
          test -w "$backup_root"
          exec 9>/opt/3dprinta/deploy.lock
          flock -n 9
          backup_name="$(date -u +%Y%m%dT%H%M%SZ)"
          [[ "$backup_name" =~ ^20[0-9]{6}T[0-9]{6}Z$ ]]
          backup_path="$backup_root/$backup_name"
          umask 077
          mkdir "$backup_path"
          cd /opt/3dprinta/current
          docker compose --project-name 3dprinta --env-file .env.production exec -T db pg_dump -U 3dprinta -d 3dprinta --format=custom < /dev/null > "$backup_path/database.dump"
          docker run --rm -v 3dprinta_model-files:/source:ro -v "$backup_path:/backup" alpine:3.20 tar -czf /backup/model-files.tar.gz -C /source .
          docker run --rm -v 3dprinta_product-images:/source:ro -v "$backup_path:/backup" alpine:3.20 tar -czf /backup/product-images.tar.gz -C /source .
          docker run --rm -v 3dprinta_privacy-ledger:/source:ro -v "$backup_path:/backup" alpine:3.20 tar -czf /backup/privacy-ledger.tar.gz -C /source .
          sha256sum "$backup_path/database.dump" "$backup_path/model-files.tar.gz" "$backup_path/product-images.tar.gz" "$backup_path/privacy-ledger.tar.gz" > "$backup_path/SHA256SUMS"
          for name in database.dump model-files.tar.gz product-images.tar.gz privacy-ledger.tar.gz SHA256SUMS; do test -s "$backup_path/$name"; done
          sha256sum --check --status "$backup_path/SHA256SUMS"
          docker compose --project-name 3dprinta --env-file .env.production exec -T db pg_restore --list < "$backup_path/database.dump" > /dev/null
          printf 'Created and verified backup: %s (UTC); four files and checksums valid; PostgreSQL archive table of contents readable.\n' "$backup_name"
          REMOTE
      - name: Remove runner credentials
        if: always()
        run: rm -f -- "${HOME}/.ssh/preflight_key"
