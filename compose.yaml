name: 3dprinta

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: 3dprinta
      POSTGRES_USER: 3dprinta
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U 3dprinta -d 3dprinta"]
      interval: 5s
      timeout: 5s
      retries: 20
    command: ["postgres", "-c", "shared_buffers=128MB", "-c", "max_connections=100"]
    logging:
      options:
        max-size: "10m"
        max-file: "3"

  migrate:
    build:
      context: .
      target: migrator
    env_file: .env.production
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  app:
    build:
      context: .
      target: runner
    restart: unless-stopped
    env_file: .env.production
    depends_on:
      migrate:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - model-files:/app/private-uploads
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health/').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s
    logging:
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  postgres-data:
  model-files:
