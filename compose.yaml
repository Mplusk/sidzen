name: 3dprinta

services:
  proxy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./deploy/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      app:
        condition: service_healthy
    logging:
      options:
        max-size: "10m"
        max-file: "3"

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: 3dprinta
      POSTGRES_USER: 3dprinta
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U 3dprinta -d 3dprinta"]
      interval: 5s
      timeout: 5s
      retries: 20
    command: ["postgres", "-c", "shared_buffers=128MB", "-c", "max_connections=100"]
    logging:
      options:
        max-size: "10m"
        max-file: "3"

  migrate:
    image: 3dprinta-migrate:${SHOP_IMAGE_TAG:-latest}
    build:
      context: .
      target: migrator
    env_file: .env.production
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  app:
    image: 3dprinta-app:${SHOP_IMAGE_TAG:-latest}
    build:
      context: .
      target: runner
    restart: unless-stopped
    env_file: .env.production
    depends_on:
      migrate:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - model-files:/app/private-uploads
      - product-images:/app/public/uploads/products
      - image-cache:/app/.next/cache/images
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health/').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s
    logging:
      options:
        max-size: "10m"
        max-file: "3"

  marketplace-worker:
    image: 3dprinta-marketplace-worker:${SHOP_IMAGE_TAG:-latest}
    build:
      context: .
      target: marketplace-worker
    restart: unless-stopped
    env_file: .env.production
    environment:
      MARKETPLACE_APP_URL: http://app:3000
      NODE_OPTIONS: --max-old-space-size=256
      SHOP_DB_CONNECTION_LIMIT: "4"
    depends_on:
      app:
        condition: service_healthy
    volumes:
      - product-images:/app/public/uploads/products
      - model-files:/app/private-uploads
    healthcheck:
      test: ["CMD", "node", "-e", "const fs=require('fs');if(Date.now()-Number(fs.readFileSync('/tmp/3dprinta-marketplace-heartbeat','utf8'))>60000)process.exit(1)"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 15s
    stop_grace_period: 30s
    logging:
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  caddy-data:
  caddy-config:
  postgres-data:
  model-files:
  product-images:
  image-cache:
