# Optional coexistence with an existing ISPmanager Nginx on TCP 80.
# Caddy keeps public HTTPS 443 and handles ACME via loopback HTTP 8080.
server {
    listen 80;
    listen [::]:80;
    server_name sidzen.shop www.sidzen.shop;
    # Do not serve the shop for unmatched hosts if Nginx selects this as default.
    if ($host !~ ^(sidzen\.shop|www\.sidzen\.shop)$) { return 404; }
    client_max_body_size 105m;
    access_log off;
    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
    }
}
