# Only the SIDZEN IDN alias; other virtual hosts remain independently managed.
# Caddy needs HTTP access for certificate issuance on both hostnames.
server {
    listen 80;
    listen [::]:80;
    server_name xn--d1agbwq9e.xn--p1ai www.xn--d1agbwq9e.xn--p1ai;
    if ($host !~ ^(xn--d1agbwq9e\.xn--p1ai|www\.xn--d1agbwq9e\.xn--p1ai)$) { return 404; }
    client_max_body_size 105m;
    access_log off;
    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
    }
}
